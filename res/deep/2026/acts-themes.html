];

// ── RENDER CARDS ──────────────────────────────────────────────────────────────

const grid = document.getElementById('theme-grid');
grid.innerHTML = THEMES.map(th => {
    const tags = [th.sub].concat(th.cities.slice(0,2).map(c => c.name));
    return `<div class="theme-card" style="--tc:${th.color};--tc-light:${th.light};--tc-border:${th.border};" onclick="openTheme('${th.id}')">
      <div class="theme-num">${th.num}</div>
      <div class="theme-title">${th.title}</div>
      <div class="theme-sub">${th.sub}</div>
      <div class="theme-idea">${th.idea}</div>
      <div class="theme-tags">
        ${th.cities.slice(0,3).map(c=>`<span class="theme-tag">${c.name}</span>`).join('')}
        <span class="theme-tag">${th.sermons.length} sermons</span>
      </div>
      <div class="theme-arrow">→</div>
    </div>`;
}).join('');

// ── WHERE ARE YOU PROMPTS ─────────────────────────────────────────────────────

document.getElementById('where-grid').innerHTML = WHERE.map(w => `
  <div onclick="openTheme('${w.theme}')" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:1rem;padding:1.25rem;cursor:pointer;transition:background .2s;" onmouseover="this.style.background='rgba(255,255,255,.09)'" onmouseout="this.style.background='rgba(255,255,255,.05)'">
    <p style="font-family:'Outfit',sans-serif;font-size:.74rem;color:rgba(255,255,255,.65);line-height:1.55;margin-bottom:.75rem;">"${w.prompt}"</p>
    <p style="font-family:'Outfit',sans-serif;font-size:.52rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#c5a059;">${w.label}</p>
    <p style="font-family:'Outfit',sans-serif;font-size:.56rem;color:rgba(255,255,255,.3);">${w.ref}</p>
  </div>`).join('');

// ── PANEL ─────────────────────────────────────────────────────────────────────

function openTheme(id) {
    const th = THEMES.find(t => t.id === id);
    if (!th) return;

    const quoteBlocks = th.quotes.map(q =>
        `<div class="quote-block" style="--qc:${th.color};--qbg:${th.light};">"${q}"</div>`
    ).join('');

    const cityTags = th.cities.map(c =>
        `<a href="/res/deep/2026/acts-journey.html" class="tp-city-tag" style="color:${th.color};border-color:${th.border};background:${th.light};">${c.name} <span style="opacity:.55;font-size:.9em;">· ${c.note}</span></a>`
    ).join('');

    const sermonRows = th.sermons.map(s => {
        const ytBtn = s.yt ? `<a href="https://www.youtube.com/watch?v=${s.yt}" target="_blank" class="sl-btn yt" title="Watch">▶</a>` : '';
        const ddBtn = s.dd ? `<a href="${s.dd}" class="sl-btn dd" title="Deep Dive">↗</a>` : '';
        return `<div class="tp-sermon">
          <div>
            <div class="tp-sermon-title">${s.t}</div>
            <div class="tp-sermon-ref">${s.ref}</div>
          </div>
          <div class="tp-sermon-links">${ytBtn}${ddBtn}</div>
        </div>`;
    }).join('');

    document.getElementById('theme-panel-content').innerHTML = `
      <div class="tp-header" style="border-bottom:1px solid rgba(0,0,0,.07);padding-bottom:1.25rem;margin-bottom:.25rem;">
        <div class="tp-num" style="color:${th.color};">${th.num}</div>
        <div class="tp-label" style="color:${th.color};">${th.sub}</div>
        <div class="tp-title">${th.title}</div>
        <div class="tp-sub">${th.sermons.length} sermons across ${th.cities.length} cities</div>
      </div>
      <div class="tp-body">
        <div class="tp-idea">${th.fullIdea}</div>

        <div class="tp-section-label">Cities in this thread</div>
        <div class="tp-cities">${cityTags}</div>

        <div class="tp-section-label">Key quotes</div>
        <div style="margin-bottom:1.25rem;">${quoteBlocks}</div>

        <div class="tp-section-label">Sermons</div>
        <div style="margin-bottom:1.25rem;">${sermonRows}</div>

        <div style="display:flex;gap:.5rem;flex-wrap:wrap;padding-top:.5rem;border-top:1px solid rgba(0,0,0,.06);">
          <a href="/res/deep/2026/acts-journey.html" class="plbtn maplink">🗺 See on Map</a>
          <a href="/res/deep/2026/acts-timeline.html" class="plbtn tl">⟳ See on Timeline</a>
        </div>
      </div>`;

    document.getElementById('theme-panel').classList.add('open');
}

function closePanel() { document.getElementById('theme-panel').classList.remove('open'); }
document.getElementById('pclose').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
</script>
</body>
</html>
