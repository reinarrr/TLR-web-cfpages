<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Dive | The Living Room</title>

    <meta property="og:title" content="Deep Dive | The Living Room">
    <meta property="og:type" content="article">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { cream: '#faf9f6', charcoal: '#1a1a1a', gold: '#c5a059', teal: '#2d5a5a' },
                    fontFamily: { display: ['Playfair Display', 'serif'], body: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        .accent-teal  { color: #2d5a5a; }
        .scripture-box {
            border-left: 3px solid #2d5a5a;
            background: #f4f7f7;
        }
        .editorial-header { border-bottom: 1px solid #e5e7eb; }
        .lead-quote { border-left: 3px solid #c5a059; }
        .greek-callout {
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.02em;
        }
    </style>
</head>

<body class="antialiased bg-cream font-body" data-current="resources">

    <div id="header-placeholder"></div>

    <main class="max-w-4xl mx-auto px-6 py-24">

        <!-- Loading state -->
        <div id="dd-loading" class="text-center py-40">
            <p class="text-zinc-400 animate-pulse font-bold tracking-widest uppercase text-sm">
                Opening Study&hellip;
            </p>
        </div>

        <!-- Content injected by ghost.js → renderDeepDive() -->
        <div id="dd-content" class="hidden"></div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="/js/ghost.js" defer></script>
    <script src="/js/main.js" defer></script>
</body>
</html>
